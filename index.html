<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KiraASB — Kalkulator Dividen &amp; Simpanan ASB Bumiputera</title>
  <meta name="description" content="Kira anggaran dividen, bonus dan pertumbuhan simpanan Amanah Saham Bumiputera (ASB) anda. Kalkulator percuma, pantas dan mesra telefon bimbit." />
  <meta name="keywords" content="kalkulator ASB, kira dividen ASB, ASB dividend calculator, simpanan ASB, KiraASB" />
  <meta name="referrer" content="no-referrer" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f6f7f4" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b1512" media="(prefers-color-scheme: dark)" />

  <meta property="og:type" content="website" />
  <meta property="og:title" content="KiraASB — Kalkulator Dividen &amp; Simpanan ASB" />
  <meta property="og:description" content="Kira anggaran dividen dan kuasa kompaun simpanan ASB anda secara masa nyata." />
  <meta property="og:locale" content="ms_MY" />
  <!-- TODO: add <link rel="canonical"> and og:url once the final domain is known -->

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />

  <!-- Apply saved theme before first paint to avoid a flash -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('kirasb_state') || '{}');
        if (s.theme === 'light' || s.theme === 'dark') document.documentElement.dataset.theme = s.theme;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="./css/styles.css" />

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebApplication",
        "name": "KiraASB",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Web",
        "inLanguage": ["ms", "en"],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "MYR" },
        "description": "Kalkulator simpanan dan anggaran dividen ASB Bumiputera untuk rakyat Malaysia."
      },
      {
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Bagaimanakah dividen ASB dikira?",
            "acceptedAnswer": { "@type": "Answer", "text": "Dividen ASB dikira berdasarkan purata Baki Minimum Bulanan (BMB) bagi setiap bulan dalam tahun kewangan." }
          },
          {
            "@type": "Question",
            "name": "Adakah dividen ASB dikenakan cukai pendapatan?",
            "acceptedAnswer": { "@type": "Answer", "text": "Tidak. Pengagihan pendapatan ASB dikecualikan daripada cukai pendapatan individu di Malaysia." }
          }
        ]
      }
    ]
  }
  </script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip">Terus ke kandungan</a>

  <header class="topbar">
    <div class="wrap topbar__in">
      <a class="brand" href="./" aria-label="KiraASB">
        <img src="./icons/icon.svg" alt="" width="36" height="36" />
        <span class="brand__txt">
          <strong>KiraASB</strong>
          <small data-i18n="tagline"></small>
        </span>
      </a>
      <div class="topbar__actions">
        <button class="btn btn--ghost btn--icon" id="langBtn" type="button" data-i18n-aria="lang">EN</button>
        <button class="btn btn--ghost btn--icon" id="themeBtn" type="button" data-i18n-aria="theme">
          <svg class="ico ico--sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="ico ico--moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="btn btn--primary" id="shareBtn" type="button">
          <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
          <span data-i18n="share"></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main" class="wrap">
    <section class="hero">
      <h1 data-i18n="heroTitle"></h1>
      <p data-i18n="heroSub"></p>
    </section>

    <div class="layout">
      <!-- RESULT -->
      <section class="card result" aria-live="polite" aria-labelledby="resultTitle">
        <div class="result__head">
          <h2 id="resultTitle" class="eyebrow" data-i18n="resultTitle"></h2>
          <span class="chip" id="growthChip"></span>
        </div>
        <p class="result__value" id="finalBalance">RM 0.00</p>
        <p class="result__sub" id="afterYears"></p>

        <div class="split" role="img" id="splitBar" aria-labelledby="splitTitle">
          <span id="splitTitle" class="sr" data-i18n="splitTitle"></span>
          <i class="split__p" id="splitP"></i><i class="split__d" id="splitD"></i>
        </div>
        <div class="legend">
          <span><i class="dot dot--p"></i><span data-i18n="legendPrincipal"></span></span>
          <span><i class="dot dot--d"></i><span data-i18n="legendDividend"></span></span>
        </div>

        <dl class="stats">
          <div><dt data-i18n="principal"></dt><dd id="totalPrincipal"></dd></div>
          <div><dt data-i18n="dividends"></dt><dd class="gold" id="totalDividend"></dd></div>
          <div><dt data-i18n="firstYear"></dt><dd id="firstYear"></dd></div>
        </dl>
      </section>

      <!-- INPUTS -->
      <section class="card inputs" aria-labelledby="inputsTitle">
        <div class="card__head">
          <h2 id="inputsTitle" data-i18n="inputsTitle"></h2>
          <button class="link" id="resetBtn" type="button" data-i18n="reset"></button>
        </div>

        <div class="field">
          <div class="field__row">
            <label for="initialInput" data-i18n="initial"></label>
            <div class="money"><span>RM</span><input id="initialInput" type="text" inputmode="decimal" autocomplete="off" /></div>
          </div>
          <input class="range" id="initialRange" type="range" min="0" max="200000" step="500" aria-labelledby="initialInput" />
        </div>

        <div class="field">
          <div class="field__row">
            <label for="monthlyInput" data-i18n="monthly"></label>
            <div class="money"><span>RM</span><input id="monthlyInput" type="text" inputmode="decimal" autocomplete="off" /></div>
          </div>
          <input class="range" id="monthlyRange" type="range" min="0" max="5000" step="50" aria-labelledby="monthlyInput" />
        </div>

        <div class="field">
          <div class="field__row">
            <label for="rateInput" data-i18n="rate"></label>
            <div class="money"><input id="rateInput" type="text" inputmode="decimal" autocomplete="off" /><span>%</span></div>
          </div>
          <div class="presets" role="group" data-i18n-aria="presets" id="presets"></div>
        </div>

        <div class="field">
          <div class="field__row">
            <label for="yearsRange" data-i18n="years"></label>
            <output class="pill" id="yearsOut" for="yearsRange"></output>
          </div>
          <input class="range" id="yearsRange" type="range" min="1" max="30" step="1" />
        </div>

        <div class="switchrow">
          <div>
            <p class="switchrow__t" id="reinvestLabel" data-i18n="reinvest"></p>
            <p class="switchrow__h" data-i18n="reinvestHint"></p>
          </div>
          <button class="switch" id="reinvestSwitch" type="button" role="switch" aria-labelledby="reinvestLabel"><span></span></button>
        </div>

        <p class="note" data-i18n="assume"></p>
      </section>
    </div>

    <!-- CHART -->
    <section class="card" aria-labelledby="chartTitle">
      <div class="card__head">
        <h2 id="chartTitle" data-i18n="chartTitle"></h2>
      </div>
      <p class="readout" id="readout" aria-live="polite"></p>
      <div class="chart" id="chart"></div>
      <p class="note" data-i18n="chartHint"></p>
    </section>

    <!-- TABLE -->
    <section class="card" aria-labelledby="tableTitle">
      <div class="card__head">
        <h2 id="tableTitle" data-i18n="tableTitle"></h2>
        <button class="link" id="toggleRows" type="button" hidden></button>
      </div>
      <div class="tablewrap">
        <table>
          <thead>
            <tr>
              <th scope="col" data-i18n="colYear"></th>
              <th scope="col" class="num" data-i18n="colPrincipal"></th>
              <th scope="col" class="num" data-i18n="colDividend"></th>
              <th scope="col" class="num" data-i18n="colBalance"></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>

    <!-- FAQ -->
    <section class="card" aria-labelledby="faqTitle">
      <div class="card__head"><h2 id="faqTitle" data-i18n="faqTitle"></h2></div>
      <div id="faq" class="faq"></div>
    </section>

    <footer class="footer">
      <p data-i18n-html="disclaimer"></p>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="./js/i18n.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
